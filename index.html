<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You Just Lost The Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useSyncExternalStore, useMemo, useRef, useCallback } = React;

        const room = new WebsimSocket();
        const lossesCollection = room.collection('losses_v3');

        function Game() {
            const gameAreaRef = useRef(null);
            const playerRef = useRef(null);
            
            const [playerState, setPlayerState] = useState({
                x: -100, // Start off-screen
                y: -100,
                vx: 0,
                vy: 0,
                grounded: false
            });
            const [gameScale, setGameScale] = useState(1);
            const [initialized, setInitialized] = useState(false);
            const keysPressed = useRef({});

            useEffect(() => {
                if (gameAreaRef.current && !initialized) {
                    const gameAreaRect = gameAreaRef.current.getBoundingClientRect();
                    setPlayerState({
                        x: gameAreaRect.width / 2 - 15, // Center horizontally relative to gameArea
                        y: -100, // Start 100px above the game area, relative to it
                        vx: 0,
                        vy: 0,
                        grounded: false
                    });
                    setInitialized(true);
                }
            }, [initialized]);

            useEffect(() => {
                const handleKeyDown = (e) => { keysPressed.current[e.code] = true; };
                const handleKeyUp = (e) => { keysPressed.current[e.code] = false; };
                window.addEventListener('keydown', handleKeyDown);
                window.addEventListener('keyup', handleKeyUp);
                return () => {
                    window.removeEventListener('keydown', handleKeyDown);
                    window.removeEventListener('keyup', handleKeyUp);
                };
            }, []);

            useEffect(() => {
                if (!initialized) return;

                let animationFrameId;

                const gameLoop = () => {
                    if (!gameAreaRef.current) return;

                    const gameAreaRect = gameAreaRef.current.getBoundingClientRect();
                    const planetCenter = {
                        x: gameAreaRect.width / 2, // relative to gameArea
                        y: gameAreaRect.height / 2 // relative to gameArea
                    };
                    const playerSize = 30;

                    setPlayerState(p => {
                        let { x, y, vx, vy } = p;
                        
                        // Gravity
                        const gravity = 0.3; // slightly reduced for better control
                        const dx = planetCenter.x - (x + playerSize / 2);
                        const dy = planetCenter.y - (y + playerSize / 2);
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        
                        if (dist > 0) {
                            vx += (dx / dist) * gravity;
                            vy += (dy / dist) * gravity;
                        }

                        // Update position first
                        x += vx;
                        y += vy;
                        
                        // Drag
                        vx *= 0.98;
                        vy *= 0.98;

                        // Calculate zoom based on distance from planet center
                        const playerCenterX = x + playerSize / 2;
                        const playerCenterY = y + playerSize / 2;
                        const distanceFromCenter = Math.sqrt(
                            Math.pow(playerCenterX - planetCenter.x, 2) + 
                            Math.pow(playerCenterY - planetCenter.y, 2)
                        );
                        
                        // Scale calculation: closer = larger scale (zoomed in), farther = smaller scale (zoomed out)
                        const maxDistance = Math.max(gameAreaRect.width, gameAreaRect.height);
                        const normalizedDistance = Math.min(distanceFromCenter / maxDistance, 1);
                        const minScale = 0.4; // Don't zoom out too much
                        const maxScale = 1.2; // Allow slight zoom in when very close
                        const targetScale = maxScale - (normalizedDistance * (maxScale - minScale));
                        
                        // Smooth scale transition
                        setGameScale(prevScale => {
                            const scaleDiff = targetScale - prevScale;
                            return prevScale + scaleDiff * 0.1; // Smooth interpolation
                        });

                        // Collision detection with planet - treat planet as solid rectangle
                        let grounded = false;
                        const playerRect = {
                            left: x,
                            right: x + playerSize,
                            top: y,
                            bottom: y + playerSize,
                            centerX: x + playerSize / 2,
                            centerY: y + playerSize / 2
                        };

                        // Check if player is inside the planet bounds (collision)
                        const isInsidePlanet = playerRect.right > 0 &&
                                             playerRect.left < gameAreaRect.width &&
                                             playerRect.bottom > 0 &&
                                             playerRect.top < gameAreaRect.height;
                        
                        if (isInsidePlanet) {
                            grounded = true;
                            // Find the closest edge and push player out
                            const distToLeft = playerRect.left;
                            const distToRight = gameAreaRect.width - playerRect.right;
                            const distToTop = playerRect.top;
                            const distToBottom = gameAreaRect.height - playerRect.bottom;

                            const minDist = Math.min(Math.abs(distToLeft), Math.abs(distToRight), Math.abs(distToTop), Math.abs(distToBottom));

                            if (minDist === Math.abs(distToLeft)) { // Push out to the left
                                x = -playerSize;
                                vx = Math.min(vx, -Math.abs(vx) * 0.5); // Bounce effect
                            } else if (minDist === Math.abs(distToRight)) { // Push out to the right
                                x = gameAreaRect.width;
                                vx = Math.max(vx, Math.abs(vx) * 0.5); // Bounce effect
                            } else if (minDist === Math.abs(distToTop)) { // Push out to the top
                                y = -playerSize;
                                vy = Math.min(vy, -Math.abs(vy) * 0.5); // Bounce effect
                            } else { // Push out to the bottom
                                y = gameAreaRect.height;
                                vy = Math.max(vy, Math.abs(vy) * 0.5); // Bounce effect
                            }
                        }

                        // Controls
                        const moveForce = 0.8; // Reduced force for finer control
                        if (keysPressed.current['ArrowUp'] || keysPressed.current['KeyW']) vy -= moveForce;
                        if (keysPressed.current['ArrowDown'] || keysPressed.current['KeyS']) vy += moveForce;
                        if (keysPressed.current['ArrowLeft'] || keysPressed.current['KeyA']) vx -= moveForce;
                        if (keysPressed.current['ArrowRight'] || keysPressed.current['KeyD']) vx += moveForce;

                        return { x, y, vx, vy, grounded };
                    });

                    animationFrameId = requestAnimationFrame(gameLoop);
                };

                gameLoop();

                return () => {
                    cancelAnimationFrame(animationFrameId);
                };
            }, [initialized]);

            return (
                <>
                    <main ref={gameAreaRef} style={{
                        transform: `scale(${gameScale})`,
                        transformOrigin: 'center',
                        transition: 'transform 0.1s ease-out'
                    }}>
                        <div ref={playerRef} className="player" style={{
                            transform: `translate(${playerState.x}px, ${playerState.y}px)`
                        }}></div>
                        <h1>You Just Lost The Game</h1>
                    </main>
                </>
            );
        }

        function DisclaimerOverlay({ onPlayClick, mostRecentLoss, weekCount }) {
            const [currentUser, setCurrentUser] = useState(null);

            useEffect(() => {
                window.websim.getCurrentUser().then(setCurrentUser);
            }, []);

            const username = mostRecentLoss ? mostRecentLoss.username : (currentUser ? currentUser.username : 'Someone');
            const date = mostRecentLoss ? new Date(mostRecentLoss.created_at).toLocaleDateString() : new Date().toLocaleDateString();

            return (
                <div className="disclaimer-overlay">
                    <div className="disclaimer-content">
                        <p>You are not able to win. It is actually not possible to win, even if you tried to win you would be unable to.</p>
                        <p>{username} tried to win on {date} and without a doubt 100% certinaly did not win.</p>
                        <p>{weekCount} users could not even win this week!</p>
                        <p>What makes you think that you can win?!</p>
                        <button className="play-button" onClick={onPlayClick}>Play</button>
                    </div>
                </div>
            );
        }

        function App() {
            const losses = useSyncExternalStore(lossesCollection.subscribe, lossesCollection.getList) || [];
            const [showDisclaimer, setShowDisclaimer] = useState(true);

            const handlePlayClick = async () => {
                await lossesCollection.create({});
                setShowDisclaimer(false);
            };

            const mostRecentLoss = useMemo(() => {
                return losses.length > 0 ? losses[0] : null;
            }, [losses]);

            const allTimeCount = useMemo(() => losses.length, [losses]);
            
            const mostRecentLoser = useMemo(() => {
                return mostRecentLoss ? mostRecentLoss.username : '...';
            }, [mostRecentLoss]);

            const { todayCount, weekCount } = useMemo(() => {
                const now = new Date();
                const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
                const startOfWeek = new Date(now.setDate(now.getDate() - now.getDay())).setHours(0,0,0,0);

                let today = 0;
                let week = 0;

                for (const loss of losses) {
                    const lossTime = new Date(loss.created_at).getTime();
                    if (lossTime >= startOfToday) {
                        today++;
                    }
                    if (lossTime >= startOfWeek) {
                        week++;
                    }
                }
                return { todayCount: today, weekCount: week };
            }, [losses]);

            if (showDisclaimer) {
                return (
                    <DisclaimerOverlay
                        onPlayClick={handlePlayClick}
                        mostRecentLoss={mostRecentLoss}
                        weekCount={weekCount}
                    />
                );
            }

            return (
                <>
                    <div className="corner top-left">
                        <div className="counter-box">
                            <span>Most Recent Loser</span>
                            <div id="most-recent-loser" className="counter-value">{mostRecentLoser}</div>
                        </div>
                    </div>
                    <div className="corner top-right">
                        <div className="counter-box">
                            <span>Lost Today</span>
                            <div id="today-counter" className="counter-value">{todayCount}</div>
                        </div>
                    </div>
                    <div className="corner bottom-left">
                        <div className="counter-box">
                            <span>All Time Losses</span>
                            <div id="all-time-counter" className="counter-value">{allTimeCount}</div>
                        </div>
                    </div>
                    <div className="corner bottom-right">
                         <div className="counter-box">
                            <span>Lost This Week</span>
                            <div id="week-counter" className="counter-value">{weekCount}</div>
                        </div>
                    </div>
                    <Game />
                </>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>

</body>
</html>
