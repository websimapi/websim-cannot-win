<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You Just Lost The Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useSyncExternalStore, useMemo, useRef, useCallback } = React;

        const room = new WebsimSocket();
        const lossesCollection = room.collection('losses_v3');

        // --- Audio Manager ---
        const AudioManager = (() => {
            let audioContext = null;
            let musicBuffer = null;
            let sourceNode = null;
            let gainNode = null;
            let analyserNode = null; // For visualization
            let isPlaying = false;
            let audioInitialized = false;

            const loadMusic = async (url) => {
                if (!audioContext) return;
                try {
                    const response = await fetch(url);
                    const arrayBuffer = await response.arrayBuffer();
                    musicBuffer = await audioContext.decodeAudioData(arrayBuffer);
                } catch (error) {
                    console.error("Error loading audio file:", error);
                }
            };

            const playLoop = () => {
                if (!musicBuffer || !audioContext) return;

                // Stop any existing playback
                if (sourceNode) {
                    sourceNode.onended = null;
                    sourceNode.stop();
                }

                sourceNode = audioContext.createBufferSource();
                sourceNode.buffer = musicBuffer;
                
                // Recreate GainNode to clear previous automation
                gainNode = audioContext.createGain();
                
                // Connect nodes: source -> analyser -> gain -> destination
                sourceNode.connect(analyserNode);
                analyserNode.connect(gainNode);
                gainNode.connect(audioContext.destination);

                const now = audioContext.currentTime;
                const songDuration = 95; // As specified in the prompt
                const fadeInDuration = 5;
                const fadeOutDuration = 15;
                const fadeOutStartTime = songDuration - fadeOutDuration;

                // Fade In
                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(1, now + fadeInDuration);

                // Fade Out
                gainNode.gain.linearRampToValueAtTime(0, now + songDuration);

                sourceNode.start(now);
                isPlaying = true;

                sourceNode.onended = () => {
                    if (isPlaying) { // Loop only if not explicitly stopped
                        playLoop();
                    }
                };
            };

            return {
                async init() {
                    if (audioInitialized) return;
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    // Resume context if it was suspended
                    if (audioContext.state === 'suspended') {
                        await audioContext.resume();
                    }
                    analyserNode = audioContext.createAnalyser();
                    analyserNode.fftSize = 256; // Lower size for broader frequency bins
                    await loadMusic('/yjltg-robo.ogg');
                    audioInitialized = true;
                },
                play() {
                    if (!audioInitialized || isPlaying) return;
                    if (audioContext && audioContext.state === 'suspended') {
                         audioContext.resume().then(playLoop);
                    } else {
                        playLoop();
                    }
                },
                stop() {
                    if (!isPlaying || !sourceNode) return;
                    isPlaying = false; // Prevents looping via onended
                    sourceNode.stop();
                    sourceNode = null;
                },
                getAnalyser() { // Expose analyser for visualization
                    return analyserNode;
                }
            };
        })();

        // Helper to wrap letters in spans
        function Title({ text }) {
            const letters = text.split('').map((char, index) => {
                if (char === ' ') {
                    return <span key={index} className="letter space">&nbsp;</span>;
                }
                return <span key={index} className="letter">{char}</span>;
            });
            return <h1 className="visualizer-title">{letters}</h1>;
        }

        function Game() {
            const gameAreaRef = useRef(null);
            const playerRef = useRef(null);
            
            const [playerState, setPlayerState] = useState({
                x: -100, // Start off-screen
                y: -100,
                vx: 0,
                vy: 0,
                grounded: false
            });
            const [gameScale, setGameScale] = useState(1);
            const [initialized, setInitialized] = useState(false);
            const keysPressed = useRef({});

            useEffect(() => {
                if (gameAreaRef.current && !initialized) {
                    const gameAreaRect = gameAreaRef.current.getBoundingClientRect();
                    setPlayerState({
                        x: gameAreaRect.width / 2 - 15, // Center horizontally relative to gameArea
                        y: -50, // Start 50px above the game area, relative to it
                        vx: 0,
                        vy: 0,
                        grounded: false
                    });
                    setInitialized(true);
                }
            }, [initialized]);

            // Visualizer effect
            useEffect(() => {
                const analyser = AudioManager.getAnalyser();
                if (!analyser) return;

                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);
                let animationFrameId;

                const visualize = () => {
                    animationFrameId = requestAnimationFrame(visualize);
                    analyser.getByteFrequencyData(dataArray);

                    // Bass frequencies (approx first 20% of buffer)
                    const bassEndIndex = Math.floor(bufferLength * 0.2);
                    let bassTotal = 0;
                    for (let i = 0; i < bassEndIndex; i++) {
                        bassTotal += dataArray[i];
                    }
                    const bassAverage = bassTotal / bassEndIndex;

                    // Normalize to a value between 0 and 1, then scale for effect
                    const normalizedPulse = bassAverage / 255;
                    const scale = 1 + normalizedPulse * 0.4; // Pulse up to 40% bigger

                    const letters = gameAreaRef.current.querySelectorAll('.letter');
                    if(letters.length > 0) {
                        letters.forEach((letter, i) => {
                             // Apply a slight delay to each letter for a ripple effect
                            const delay = i * 0.03;
                            const delayedScale = 1 + (normalizedPulse * Math.cos(delay)) * 0.4;
                            letter.style.transform = `scale(${delayedScale})`;
                        });
                    }
                };

                visualize();

                return () => {
                    cancelAnimationFrame(animationFrameId);
                    // Reset styles on cleanup
                    const letters = gameAreaRef.current?.querySelectorAll('.letter');
                    if(letters?.length > 0) {
                        letters.forEach(letter => letter.style.transform = 'scale(1)');
                    }
                };
            }, [initialized]);

            return (
                <>
                    <main ref={gameAreaRef} style={{
                        transformOrigin: 'center',
                        transition: 'transform 0.1s ease-out'
                    }}>
                        <div ref={playerRef} className="player" style={{
                            display: 'none' // Hide player for now
                        }}></div>
                        <Title text="You Just Lost The Game" />
                    </main>
                </>
            );
        }

        function DisclaimerOverlay({ onPlayClick, mostRecentLoss, weekCount }) {
            const [currentUser, setCurrentUser] = useState(null);

            useEffect(() => {
                window.websim.getCurrentUser().then(setCurrentUser);
            }, []);

            const username = mostRecentLoss ? mostRecentLoss.username : (currentUser ? currentUser.username : 'Someone');
            const date = mostRecentLoss ? new Date(mostRecentLoss.created_at).toLocaleDateString() : new Date().toLocaleDateString();

            return (
                <div className="disclaimer-overlay">
                    <a href="https://sonauto.ai/" target="_blank" rel="noopener noreferrer" className="sonauto-link" title="Music Generated with Sonauto.ai">
                        <img src="/sonauto.png" alt="Sonauto.ai Logo" />
                    </a>
                    <div className="disclaimer-content">
                        <p>You are not able to win. It is actually not possible to win, even if you tried to win you would be unable to.</p>
                        <p>{username} tried to win on {date} and without a doubt 100% certinaly did not win.</p>
                        <p>{weekCount} users could not even win this week!</p>
                        <p>What makes you think that you can win?!</p>
                        <button className="play-button" onClick={onPlayClick}>Play</button>
                    </div>
                </div>
            );
        }

        function FadeInOverlay() {
            return <div className="fade-in-overlay"></div>;
        }

        function App() {
            const losses = useSyncExternalStore(lossesCollection.subscribe, lossesCollection.getList) || [];
            const [showDisclaimer, setShowDisclaimer] = useState(true);
            const [isFading, setIsFading] = useState(false);

            const handlePlayClick = async () => {
                await lossesCollection.create({});
                setShowDisclaimer(false);
                setIsFading(true);
                
                // Initialize and play audio on user interaction
                await AudioManager.init();
                AudioManager.play();

                setTimeout(() => {
                    setIsFading(false);
                }, 10000); // Corresponds to fade animation duration
            };

            const mostRecentLoss = useMemo(() => {
                return losses.length > 0 ? losses[0] : null;
            }, [losses]);

            const allTimeCount = useMemo(() => losses.length, [losses]);
            
            const mostRecentLoser = useMemo(() => {
                return mostRecentLoss ? mostRecentLoss.username : '...';
            }, [mostRecentLoss]);

            const { todayCount, weekCount } = useMemo(() => {
                const now = new Date();
                const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
                const startOfWeek = new Date(now.setDate(now.getDate() - now.getDay())).setHours(0,0,0,0);

                let today = 0;
                let week = 0;

                for (const loss of losses) {
                    const lossTime = new Date(loss.created_at).getTime();
                    if (lossTime >= startOfToday) {
                        today++;
                    }
                    if (lossTime >= startOfWeek) {
                        week++;
                    }
                }
                return { todayCount: today, weekCount: week };
            }, [losses]);

            if (showDisclaimer) {
                return (
                    <DisclaimerOverlay
                        onPlayClick={handlePlayClick}
                        mostRecentLoss={mostRecentLoss}
                        weekCount={weekCount}
                    />
                );
            }

            return (
                <>
                    {isFading && <FadeInOverlay />}
                    <div className="corner top-left">
                        <div className="counter-box">
                            <span>Most Recent Loser</span>
                            <div id="most-recent-loser" className="counter-value">{mostRecentLoser}</div>
                        </div>
                    </div>
                    <div className="corner top-right">
                        <div className="counter-box">
                            <span>Lost Today</span>
                            <div id="today-counter" className="counter-value">{todayCount}</div>
                        </div>
                    </div>
                    <div className="corner bottom-left">
                        <div className="counter-box">
                            <span>All Time Losses</span>
                            <div id="all-time-counter" className="counter-value">{allTimeCount}</div>
                        </div>
                    </div>
                    <div className="corner bottom-right">
                         <div className="counter-box">
                            <span>Lost This Week</span>
                            <div id="week-counter" className="counter-value">{weekCount}</div>
                        </div>
                    </div>
                    <Game />
                </>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>

</body>
</html>
